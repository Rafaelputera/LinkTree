    <script>
        // Simulate Loading
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('opacity-0');
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('content').classList.remove('hidden');
                    document.getElementById('content').classList.add('flex');
                }, 500);
            }, 1000);
            
            document.getElementById('year').textContent = new Date().getFullYear();
        });

        // Theme Toggle Logic
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                document.body.classList.replace('bg-neutral-950', 'bg-neutral-50');
                localStorage.setItem('theme', 'light');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                document.body.classList.replace('bg-neutral-50', 'bg-neutral-950');
                localStorage.setItem('theme', 'dark');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.95 16.95l.707.707M7.05 7.05l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />';
            }
        }

        // Copy Clipboard
        function copyToClipboard(e, text) {
            e.preventDefault();
            e.stopPropagation();
            navigator.clipboard.writeText(text);
            
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }

        // Filter Links
        function filterLinks() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('link-card');
            
            for (let card of cards) {
                const text = card.textContent.toLowerCase();
                if (text.includes(input)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }

        // Persistent Theme
        if (localStorage.getItem('theme') === 'light') {
            toggleTheme();
        }
    </script>
